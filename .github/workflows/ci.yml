name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required to scan pull requests; without it the action fails on every
          # PR (including Dependabot's) while still passing on pushes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma reads this for `generate`; no real database is contacted in CI.
      DATABASE_URL: postgresql://clarity:password@localhost:5432/clarity?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Backend type-check
        run: npx tsc --noEmit
        working-directory: ./backend

      - name: Backend tests
        run: npm test
        working-directory: ./backend

      - name: Frontend type-check
        run: npx vue-tsc --noEmit -p tsconfig.app.json
        working-directory: ./frontend

      - name: Frontend tests
        run: npm test
        working-directory: ./frontend

      - name: Frontend build
        run: npm run build
        working-directory: ./frontend

      - name: Verify installable PWA assets
        run: |
          test -s frontend/dist/manifest.webmanifest
          test -s frontend/dist/sw.js
          test -s frontend/dist/pwa-192x192.png
          test -s frontend/dist/pwa-512x512.png

      # Fails on every high/critical advisory except those with a written
      # justification in .audit-allowlist.json.
      - name: Security audit
        run: npm run audit

  # Builds the images without publishing, so a broken Dockerfile fails the PR
  # rather than the release. Publishing lives in docker-publish.yml.
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
