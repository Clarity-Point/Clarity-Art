# Discussions are not enabled on this repository, so questions are routed to an
# issue form instead of a dead link. If Discussions is turned on later, add a
# contact link here and retire question.yml.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/Clarity-Point/Clarity-Art/security/advisories/new
    about: Report privately — never in a public issue.
  - name: In crisis?
    url: https://findahelpline.com
    about: >
      This project is not emergency care. If you or someone you know is in crisis,
      contact your local emergency services or a crisis hotline.
