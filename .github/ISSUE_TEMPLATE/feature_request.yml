name: Feature request
description: Suggest an improvement or new capability
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case before the solution — who needs this, and when?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: safety
    attributes:
      label: Scope
      options:
        - label: >
            I understand this project is not a medical device, and this request does
            not ask it to diagnose, triage, or provide emergency or clinical care.
          required: true
