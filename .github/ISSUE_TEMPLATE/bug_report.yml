name: Bug report
description: Something is broken or behaves unexpectedly
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not use this form for security vulnerabilities** —
        follow [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: how-running
    attributes:
      label: How are you running it?
      options:
        - Docker Compose (production stack)
        - Docker Compose (dev stack)
        - Locally with npm
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Backend logs help a lot. Include the `requestId` from the failing response
        if you have it. Redact anything personal before pasting.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or commit sha

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This report contains no secrets and no real personal data
          required: true
