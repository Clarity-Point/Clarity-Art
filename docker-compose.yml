services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: tochka_yasnosti
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD:-password}@db:5432/tochka_yasnosti?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Optional AI provider (OpenAI-compatible; local or hosted). Leave unset to
      # run with graceful canned fallbacks.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      PORT: 3000
      FRONTEND_URL: http://localhost
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
